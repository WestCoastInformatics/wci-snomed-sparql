spring.application.name=wci-snomed-sparql
server.port=8080

# The toolkit warns for every language refset member of an inactive description, and ELK warns for each
# unsupported/partially supported axiom (DataHasValue, SubDataPropertyOf); classification still matches the
# release inferred relationships, so keep these quiet.
logging.level.org.snomed.otf.owltoolkit.taxonomy.SnomedTaxonomy=ERROR
logging.level.org.semanticweb.elk=ERROR
